set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

set -g status-right ""

set -g status-keys vi
set -g mode-keys vi

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

bind c new-window -c "#{pane_current_path}"

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -p 32 -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g detach-on-destroy off
set -g mouse on
set -g history-limit 65536

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

set -sg escape-time 0

# managed application keybindings

# move between windows with fzf
bind O display-popup 'tmux new-session -A -s popup -n popup'
bind W run-shell -b 'tmux list-windows -a | sed "s/ (.* panes).*//" | fzf --reverse | sed "s/: .*//" | xargs -I{} tmux switch-client -t {}'
bind K if-shell 'tmux select-window -t k9s' '' 'new-window -n k9s "k9s"'
bind A if-shell 'tmux select-window -t opencode' '' 'new-window -c "#{pane_current_path}" -n opencode "[ -f .env ] && source .env; opencode"'
bind H if-shell 'tmux has-session -t home' 'switch-client -t home' 'new-session -s home -c ~'
bind I split-window -v -p 32 -c "#{pane_current_path}" "source ./.venv/bin/activate && ipython"

# plugins managed by home manager

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:RGB"

set -g status-right ""

set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

bind c new-window -c "#{pane_current_path}"

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -p 32 -c "#{pane_current_path}"

unbind r
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g detach-on-destroy off
set -g mouse on
set -g history-limit 16384

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel "pbcopy"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

set -sg escape-time 0

bind o display-popup "tmux new-session -A -s popup"

# move between windows with fzf
bind W run-shell -b "tmux list-windows -a | sed 's/ (.* panes).*//' | fzf --reverse | sed 's/: .*//' |  xargs -I{} tmux switch-client -t {}"

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmuxplugin-tmux-power' # NOTE: loaded from import in nixos
set -g @tmux_power_theme '#CCCCCC'
